# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "fr-FR"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_instructions:
    - path: "keyboards/**/keymap.json"
      instructions: "Keymap QMK pour un Sofle v2 (splitkb Aurora, contrôleur Liatris). Vérifier la cohérence des couches et des keycodes."
    - path: "keyboards/**"
      instructions: "Code QMK (features.c, config.h, rules.mk). Vérifier la compatibilité avec QMK master et le RP2040 (Liatris)."
    - path: ".github/workflows/**"
      instructions: "Vérifier la sécurité du workflow (permissions, injection via github.event) et l'épinglage des actions."

chat:
  auto_reply: true
